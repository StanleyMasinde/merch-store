[package]
name = "merch-store"
version = "0.1.0"
edition = "2024"
default-run = "merch-store"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["tracing", "macros"] }
daraja-sdk = "0.4.1"
jiff = { version = "0.2.37", features = ['serde'] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toasty = { version = "0.11.0", features = ["mysql", "jiff"] }
toasty-cli = "0.11.0"
tokio = { version = "1.53.1", features = ["rt", "macros", "rt-multi-thread", "test-util"] }
toml = "1.1.6"
tower = { version = "0.5.3", features = ["tracing"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
axum-test = "21.1.0"
